name: Coverage — yarilo

## Not in gate.yml: a push whose tree passed its pull request skips the gate,
## so a gate upload would never reach develop, where the report is read.
on:
  push:
    branches:
      - develop
      - main
    paths:
      - "app/**"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "codecov.yml"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          ## Same as gate.yml: the runner's local Go cache is the one that works.
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.19.0

      ## -coverpkg=./... counts a package's statements run by any package's
      ## tests; the flatcurve engine only builds with its tag, so it runs apart.
      - name: Run tests with coverage
        run: |
          go test -count=1 -coverpkg=./... -coverprofile="$RUNNER_TEMP"/cover-all.out ./...
          if ! dpkg -s libxapian-dev >/dev/null 2>&1 || ! command -v g++ >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxapian-dev g++
          fi
          CGO_ENABLED=1 go test -count=1 -tags flatcurve -coverpkg=./... -coverprofile="$RUNNER_TEMP"/cover-fc.out \
            ./internal/fts/flatcurve/ ./internal/ftsservice/ ./internal/ftsbench/

      ## Every test binary writes a block for every package, so the raw profiles
      ## run to hundreds of megabytes; one line per block, the highest count kept.
      - name: Merge the profiles
        run: |
          awk 'FNR == 1 { if (NR == 1) print; next }
               { k = $1 " " $2; if (!(k in n) || $3 > n[k]) n[k] = $3 }
               END { for (k in n) print k, n[k] }' "$RUNNER_TEMP"/cover-all.out "$RUNNER_TEMP"/cover-fc.out > "$RUNNER_TEMP"/cover.out
          ls -l "$RUNNER_TEMP"/cover.out
          go tool cover -func="$RUNNER_TEMP"/cover.out | tail -1

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/cover.out
          disable_search: true
          fail_ci_if_error: true
