name: CI — yarilo

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "hack/**"
      - "helm/**"
      - "helm_values/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      ## Any workflow: gate.yml treats the directory as code, and a push
      ## filter narrower than the gate's own list is a difference nobody
      ## declared.
      - ".github/workflows/**"
  ## No paths here. The filter lives in gate.yml, which decides whether the
  ## lint and test jobs have anything to do -- a docs-only PR skips them, and a
  ## skipped job satisfies a required check while a run that never starts
  ## leaves it "expected" for ever.
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/yarilo
  DOCKERHUB_IMAGE: docker.io/0kaba0/yarilo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ## Lint and test live in gate.yml so that this pipeline and the develop one
  ## run the same gate rather than two copies of it.
  gate:
    uses: ./.github/workflows/gate.yml
    ## A called workflow cannot ask for more than its caller grants: the test
    ## job publishes a check run, and Changes reads the gated-tree artifacts.
    permissions:
      contents: read
      checks: write
      actions: read

  ## main takes merges from develop only; a required check, since branch
  ## protection cannot name the source branch.
  source:
    name: Source is develop
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux]
    steps:
      - name: Refuse any other head
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::main accepts pull requests from develop only, got $HEAD_REPO:$HEAD_REF"
            exit 1
          fi

  build:
    name: Build & Push
    if: github.event_name == 'push'
    needs: [gate]
    runs-on: [self-hosted, linux]
    concurrency:
      group: build-main-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/, ""); print $2}' helm/Chart.yaml)
          RELEASE_TAG="v${APP_VERSION}"
          # Where the tag points is the source of truth, and there is only one
          # of it. Asking "does a Release exist" instead needed the answer to
          # separate 404 from every other failure, and it did not: a merge
          # without a version bump read as "not released yet" and walked into
          # the tag guard (#1499).
          #
          # Three states:
          #   no tag                -> a release
          #   tag at this commit    -> the #1331 recovery: the tag was pushed
          #                            and the Release step failed after it
          #   tag somewhere else    -> not a release; a bump-free merge
          if ! EXISTING=$(git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" 2>/dev/null); then
            STATE=release
          elif [ "$(echo "$EXISTING" | cut -f1)" = "${GITHUB_SHA}" ]; then
            STATE=recover
          else
            STATE=not-a-release
            echo "::notice::${RELEASE_TAG} already points elsewhere; this commit carries no version bump, so only the SHA tag is published"
          fi
          # The version-tagged image belongs to the commit the version names.
          # Publishing it from any other commit is how :2.3.265 came to exist
          # twice, which the chart's pullPolicy: IfNotPresent relies on not
          # happening.
          case "${STATE}" in
            release|recover) IS_RELEASE=true ;;
            *)               IS_RELEASE=false ;;
          esac
          # The chart's own version, stamped into the image so a pod can say
          # whether the ConfigMap beside it came from the same commit (#1509).
          CHART_VERSION=$(awk '/^version:/{print $2}' helm/Chart.yaml)
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The self-hosted runner's docker daemon persists between runs, same
          # as GOCACHE/GOMODCACHE above, so the classic docker driver already
          # reuses layers from its own local build cache with no export step
          # and no per-run trip to the GitHub Actions cache API -- see the
          # dropped cache-from/cache-to below.
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: 0kaba0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-from/cache-to: the docker driver above already reuses
          # this runner's own layer cache locally. An explicit GHA cache
          # export would only add a network round-trip this runner does not
          # need, and it requires the containerd image store to be enabled on
          # the daemon in the first place -- a setting outside this file.
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.image_tag }}
            BUILD_CHART_VERSION=${{ steps.version.outputs.chart_version }}

      - name: Generate release notes
        if: steps.version.outputs.is_release == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Push git tag
        if: steps.version.outputs.state == 'release'
        run: |
          # The state was decided from this same tag one step above, so the
          # check here is against a race, not against the ordinary case: two
          # pushes close together could both read "no tag".
          TAG="${{ steps.version.outputs.tag }}"
          if EXISTING=$(git ls-remote --exit-code --tags origin "refs/tags/${TAG}" 2>/dev/null); then
            echo "::error::${TAG} appeared at $(echo "$EXISTING" | cut -f1) since this run began -- refusing to move a published tag"
            exit 1
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      ## Only in the recovery state, and only on an exact 404. Asking `gh
      ## release view` whether a release exists treated every failure as
      ## "missing", which is the fail-open that produced #1499; the status code
      ## is the answer, and anything that is neither 200 nor 404 stops the job
      ## rather than guessing.
      - name: Is the Release missing
        id: release_missing
        if: steps.version.outputs.state == 'recover'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CODE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --silent --include 2>/dev/null | head -1 | grep -oE '[0-9]{3}' | head -1 || true)
          case "${CODE}" in
            200) echo "missing=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "missing=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::asking about ${TAG} answered ${CODE:-nothing}; refusing to guess whether the release exists"
                 exit 1 ;;
          esac

      - name: Create GitHub Release
        if: steps.version.outputs.state == 'release' || steps.release_missing.outputs.missing == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md

      ## The chart goes to ghcr.io/<owner>/charts/yarilo as an OCI artifact,
      ## which is what Artifact Hub indexes. A separate package from the image,
      ## so the GHCR cleanup below never touches it.
      - name: Set up Helm
        if: steps.version.outputs.is_release == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          ## Same pin as the lint job in gate.yml.
          version: v3.19.0

      - name: Push Helm chart to GHCR
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_REPO="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          VERSION="${{ steps.version.outputs.chart_version }}"
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          # A published chart version is never overwritten: the recovery state
          # re-runs this step for a commit whose chart may already be there.
          if helm show chart "${CHART_REPO}/yarilo" --version "${VERSION}" >/dev/null 2>&1; then
            echo "::notice::chart yarilo ${VERSION} is already in ${CHART_REPO}; not pushing it again"
            exit 0
          fi
          helm package helm --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/yarilo-${VERSION}.tgz" "${CHART_REPO}"

      ## Artifact Hub reads an OCI repository's metadata from its
      ## `artifacthub.io` tag; the repositoryID in it earns the Verified
      ## Publisher label. Metadata only, so re-pushing it on every release is
      ## harmless.
      - name: Set up ORAS
        if: steps.version.outputs.is_release == 'true'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push Artifact Hub repository metadata
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/yarilo:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Set up Go
        if: steps.version.outputs.is_release == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      ## The release's settings export, which the docs check its settings data against.
      - name: Attach the settings export
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./hack/settingsexport > "${RUNNER_TEMP}/settings.json"
          gh release upload "${{ steps.version.outputs.tag }}" "${RUNNER_TEMP}/settings.json" --clobber

      ## GHCR is the working set and is pruned; Docker Hub is the durable
      ## archive and is never cleaned. That split is what makes "roll back
      ## after a bad upgrade" available to an operator several releases
      ## behind, rather than only to one who upgraded yesterday (#1217).
      ## Keeps the 16 newest tagged images with their child manifests;
      ## releases and latest are excluded, so chart-pinned images stay.
      - name: Cleanup old GHCR versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: yarilo
          use-regex: true
          keep-n-tagged: 16
          exclude-tags: '^(latest|\d+\.\d+\.\d+)$'
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          ## First run reads only; turned off once its log shows the plan.
          dry-run: true
          token: ${{ secrets.GITHUB_TOKEN }}

      ## The same tag on the docs repo's main publishes that version of the
      ## docs. A tag already there is never moved.
      - name: Tag the documentation
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_TAG_TOKEN }}
          DOCS_REPO: yarilomail/documentation
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Without it, gh would fall back to the runner's own login.
          [ -n "${GH_TOKEN}" ] || { echo "::error::secret DOCS_TAG_TOKEN is not set"; exit 1; }
          CODE=$(gh api "repos/${DOCS_REPO}/git/ref/tags/${TAG}" \
            --silent --include 2>/dev/null | head -1 | grep -oE '[0-9]{3}' | head -1 || true)
          case "${CODE}" in
            200) echo "::notice::${DOCS_REPO} already has ${TAG}; leaving it"; exit 0 ;;
            404) ;;
            *)   echo "::error::asking ${DOCS_REPO} about ${TAG} answered ${CODE:-nothing}"; exit 1 ;;
          esac
          SHA=$(gh api "repos/${DOCS_REPO}/git/ref/heads/main" -q .object.sha)
          gh api "repos/${DOCS_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" --silent
          echo "Tagged ${DOCS_REPO}@${SHA::7} as ${TAG}"
