name: CI — develop

## The develop line: every green build feeds the sandbox.
##
## Two differences from the master pipeline, both deliberate. Nothing here
## reaches Docker Hub -- stable users pull only what master published. And no
## git tag and no GitHub release are created: a release number belongs to a
## master merge, not to a build counter.
##
## Merged into the current line before `develop` exists. It activates when the
## branch appears, which is the point: the pipeline that feeds the sandbox
## should not be written on the day it is first needed.
on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - "helm/**"
      - "helm_values/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      ## Any workflow: gate.yml treats the directory as code, and a push
      ## filter narrower than the gate's own list is a difference nobody
      ## declared.
      - ".github/workflows/**"
  ## The same gate a PR into master gets. Without this a PR into develop ran
  ## nothing and was green because nothing had run. No paths, for the reason
  ## given in ci.yml: gate.yml holds the one list.
  pull_request:
    branches:
      - develop
  workflow_dispatch:

## PR pushes supersede each other; a push to develop never does, because its
## build feeds the sandbox and must finish. Same rule as the master line.
concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yarilo
  ## Until master exists, dev images are candidates for the first stable
  ## release. After it, the next release is master's version with the patch
  ## raised -- read from the branch rather than committed anywhere, because a
  ## number in a file on develop is a number someone has to remember to change.
  FIRST_RELEASE: "2.4.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ## Dev tags kept in GHCR besides `latest`. Enough to roll the sandbox back
  ## past the candidate that broke it; not so many that the registry becomes an
  ## archive nobody prunes.
  KEEP_DEV_TAGS: "3"

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    ## A called workflow cannot ask for more than its caller grants,
    ## and the test job publishes a check run.
    permissions:
      contents: read
      checks: write

  build:
    name: Build & Push (develop)
    ## Pushes only. A pull_request event now reaches this workflow, and without
    ## this a PR would publish a dev image from its own head -- a candidate tag
    ## naming a commit that is not on the branch.
    if: github.event_name != 'pull_request'
    needs: [gate]
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine dev tag
        id: version
        run: |
          set -euo pipefail
          # The next release is master's version with the patch raised. Before
          # master exists there is nothing to raise, so the first release
          # number stands in -- and the fallback is announced rather than
          # silent, because a wrong number here names images QA will pin.
          if git fetch --quiet --depth=1 origin master 2>/dev/null &&
             MASTER_VERSION=$(git show FETCH_HEAD:helm/Chart.yaml 2>/dev/null | awk '/^appVersion:/{gsub(/"/, ""); print $2}') &&
             [ -n "${MASTER_VERSION}" ]; then
            NEXT=$(echo "${MASTER_VERSION}" | awk -F. '{printf "%s.%s.%d", $1, $2, $3 + 1}')
          else
            NEXT="${FIRST_RELEASE}"
            echo "::notice::no master branch yet; dev images are candidates for ${NEXT}"
          fi
          # github.run_number is monotonic per workflow and never reused, which
          # is what an immutable name needs. It is not a commit count: two
          # builds of one commit get two names, and that is correct -- they are
          # two artefacts.
          DEV_TAG="${NEXT}-dev.${GITHUB_RUN_NUMBER}"
          # The chart's own version, stamped into the image so a pod can say
          # whether the ConfigMap beside it came from the same commit (#1509).
          CHART_VERSION=$(awk '/^version:/{print $2}' helm/Chart.yaml)
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=${DEV_TAG}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "building ${DEV_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.dev_tag }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.dev_tag }}
            BUILD_CHART_VERSION=${{ steps.version.outputs.chart_version }}

  prune:
    name: Prune old dev tags
    ## Its own job, so housekeeping that fails is red on its own and a build
    ## whose image is already in the registry is not (#1808).
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux]
    permissions:
      packages: write
    steps:
      - name: Prune
        uses: actions/delete-package-versions@v5
        with:
          package-name: yarilo
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_DEV_TAGS }}
          ## Releases and `latest` are never ours to delete: a version is
          ## removed with every name it carries.
          ignore-versions: '^(latest|\d+\.\d+\.\d+)$'
          token: ${{ secrets.GITHUB_TOKEN }}
