name: Deps check — yarilo

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check Go dependency updates
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check for updates
        id: check
        run: |
          # "all" reaches the TEST dependencies of our dependencies -- modules
          # that are in the graph, are never built into anything we ship, and
          # cannot be updated by the command this job then suggests. That noise
          # is what made the first issue unactionable (#1447).
          #
          # -deps -test ./... is the honest set: what our binaries import, plus
          # what OUR tests import. Someone else's test dependency is theirs.
          MODS=$(go list -deps -test -f '{{with .Module}}{{.Path}}{{end}}' ./... \
            | sort -u | grep -v '^$' | grep -v '^github.com/yarilomail/yarilo/v2$')
          if [ -z "$MODS" ]; then
            echo "::error::could not list module dependencies; refusing to report 'no updates' from a check that checked nothing"
            exit 1
          fi
          echo "checking $(echo "$MODS" | wc -l) modules"
          # A failed lookup lists no updates and would close the issue. -u stays silent
          # under GOPROXY=off, so an explicit @latest query proves the proxy answers.
          if ! go list -m "$(echo "$MODS" | head -1)@latest" >/dev/null || ! LISTED=$(go list -m -u $MODS); then
            echo "::error::go list -m -u failed; refusing to report 'no updates' from a lookup that did not finish"
            exit 1
          fi
          UPDATES=$(echo "$LISTED" | grep '\[' || true)
          if [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            {
              echo "updates<<EOF"
              echo "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open, refresh or close the issue
        uses: actions/github-script@v9
        # Through env the list is data; spliced into the script it is code.
        env:
          UPDATES: ${{ steps.check.outputs.updates }}
          HAS_UPDATES: ${{ steps.check.outputs.has_updates }}
        with:
          script: |
            const title = 'Go dependency updates available';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies'
            });
            const open = existing.data.find(i => i.title === title);
            if (process.env.HAS_UPDATES !== 'true') {
              if (open) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.number, state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed #${open.number}: no updates left`);
              }
              return;
            }
            const body = [
              'The following Go modules have newer versions available:',
              '',
              '```',
              process.env.UPDATES,
              '```',
              '',
              'To update one, run:',
              '```sh',
              'go get <module>@latest && go mod tidy',
              '```',
              '',
              'Only modules yarilo builds or tests with are listed; test dependencies of dependencies are not ours to bump.',
            ].join('\n');
            if (open) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              });
              core.info(`Refreshed #${open.number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ['dependencies'], body,
            });
