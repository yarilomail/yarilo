apiVersion: batch/v1
kind: Job
metadata:
  name: smoketest
  namespace: yarilo-sb
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
      # The backend admin API speaks mTLS; the quota consistency row needs a
      # client certificate, not just the bearer token.
      - name: internal-tls
        secret:
          secretName: yarilo-internal-tls
      containers:
      - name: smoketest
        # Substituted by run.sh: a literal here rots at the next bump, and the
        # last one pointed at a tag the registry no longer carried.
        image: ghcr.io/yarilomail/yarilo:__IMAGE_TAG__
        volumeMounts:
        - name: internal-tls
          mountPath: /tls
          readOnly: true
        env:
        # The director row authenticates with this token; without it the row
        # fails with HTTP 401 rather than skipping, because -director-api is set.
        - name: DIRECTOR_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: yarilo-director-api-token
              key: token
        - name: YARILO_STATIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yarilo-static-passdb
              key: password
        command:
        - yarilo-smoketest
        args:
        # A row whose surfaces are not all configured registers as a visible
        # skip rather than a silent pass, so every flag below adds a row that
        # is either checked or reported as skipped. Dropping one hides a check.
        # -host is the default for every protocol; the ones that answer
        # elsewhere name their own address. POP3S and ManageSieve are on the
        # LoadBalancer, lmtp-login only on its ClusterIP -- which is why one
        # -host could not reach all three and that row used to skip.
        - -host=10.50.80.29
        # In-cluster, deliberately: the static passdb hands out its credential
        # with allow_nets bound to the pod CIDR, and a dial through the
        # LoadBalancer arrives from the node address instead -- the row then
        # fails AUTHENTICATIONFAILED with a password that is perfectly good.
        # Widening allow_nets would have hidden that; naming the service keeps
        # the credential as narrow as it was meant to be.
        - -imap-host=yarilo-imap-login
        - -lmtp-login-host=yarilo-lmtp-login
        - -imap-port=993
        # The login itself: the host and port were given and the identity was
        # not, so the row skipped on every run of this job (#1855).
        # The submission path is on the stand since #1863; its backend is
        # behind submission-login, which terminates TLS on 587.
        - -smtp-sub
        - -smtp-host=yarilo-submission-login
        - -smtp-sub-port=587
        - -imap-user=u1@d00001.test
        - -imap-pass=Yarilo!test1
        - -lmtp-login
        - -insecure=true
        - -timeout=20s
        - -telemetry=http://yarilo-imap-login-telemetry:8080
        - -pop3s
        - -pop3s-port=995
        # The maildrop cycle: STAT/LIST/RETR/UIDL and a deletion, on a message
        # this run delivers and removes again (#1734).
        - -pop3-user=u1@d00001.test
        - -pop3-pass=Yarilo!test1
        - -managesieve
        - -managesieve-port=4190
        - -managesieve-user=u1@d00001.test
        - -managesieve-pass=Yarilo!test1
        - -sieve
        - -delivery-host=yarilo-lmtp-login
        - -delivery-port=24
        - -delivery-proto=lmtp
        - -passwd-file-user=u1@d00001.test
        - -passwd-file-pass=Yarilo!test1
        # The static passdb matches every username, so this names an account
        # that exists nowhere else; the password reaches the job the same way
        # it reaches the server, from the secret, and works only from inside
        # the cluster network (allow_nets).
        - -static-user=static@d00001.test
        - -static-pass=$(YARILO_STATIC_PASSWORD)
        - -quota-user=u1@d00001.test
        - -quota-pass=Yarilo!test1
        # The MX runs in its own namespace: inbound mail is not this release's
        # submission host, so it carries its own address (#1855).
        - -smtp-mx
        - -smtp-mx-host=relay-mx.yarilo-relay
        - -smtp-mx-port=25
        - -xclient
        - -xclient-port=10024
        - -proxy-protocol
        - -proxy-protocol-port=10025
        - -scram-user=scram@d00001.test
        - -scram-pass=Yarilo!test1
        - -quota-over-user=over@d00001.test
        - -quota-over-pass=Yarilo!test1
        - -acl-user=u1@d00001.test
        - -acl-pass=Yarilo!test1
        # The owner-templated namespace, not Public/: the owner creates in its
        # own store and the peer reaches it through user/<owner>/ (#1858).
        - -acl-peer-user=u2@d00001.test
        - -acl-peer-pass=Yarilo!test1
        - -acl-shared-prefix=user/u1@d00001.test/
        - -envelope-user=u1@d00001.test
        - -envelope-pass=Yarilo!test1
        - -fts-user=u1@d00001.test
        - -fts-pass=Yarilo!test1
        # One account per storage driver: the copy-scope row runs on mdbox,
        # maildir and sdbox, since each stores a copy its own way.
        - -fts-copy-users=u1@d00001.test:Yarilo!test1,u51@d00001.test:Yarilo!test1,u101@d00001.test:Yarilo!test1
        - -director-api=http://yarilo-director-api:9103
        # The service is yarilo-backend (not -backend-api) and 9105 is HTTPS.
        - -backend-api=https://yarilo-backend:9105
        - -backend-api-cert=/tls/tls.crt
        - -backend-api-key=/tls/tls.key
        - -backend-api-ca=/tls/ca.crt
        - -jmap
        - -jmap-host=10.50.80.29
        - -jmap-port=443
        - -jmap-user=u1@d00001.test
        - -jmap-pass=Yarilo!test1
