# The stand's own resolver for the zone test.: DKIM TXT records only, so
# receivers on the stand verify signatures. Applied by dns-apply.sh, which also
# makes the ConfigMap stand-dns from stand-dns/.
apiVersion: v1
kind: Namespace
metadata:
  name: stand-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stand-dns
  namespace: stand-dns
  labels:
    app: stand-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stand-dns
  template:
    metadata:
      labels:
        app: stand-dns
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.12.3
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stand-dns
---
apiVersion: v1
kind: Service
metadata:
  name: stand-dns
  namespace: stand-dns
spec:
  selector:
    app: stand-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
