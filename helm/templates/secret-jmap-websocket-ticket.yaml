{{- if .Values.components.jmapLogin.enabled }}
{{- $secretName := printf "%s-jmap-websocket-ticket" (include "yarilo.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := "" }}
{{- if $existing }}
{{- $key = index $existing.data "key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "jmap-login") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key | b64enc }}
{{- end }}
