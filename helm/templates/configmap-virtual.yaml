{{- if .Values.virtualDefinitions }}
# Virtual mailbox definitions shared by every user: one key per mailbox, its
# value the configuration file the virtual driver reads. Mounted read-only, so
# the namespace reading them names an index path of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yarilo.fullname" . }}-virtual
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
data:
  {{- range $name, $text := .Values.virtualDefinitions }}
  {{ printf "%s/yarilo-virtual" $name | quote }}: |
    {{- $text | nindent 4 }}
  {{- end }}
{{- end }}
