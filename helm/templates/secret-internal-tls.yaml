{{- /* Per-role internal mTLS certificates (#2132), all minted in this one file:
       genCA is random per call, so the CA must be made once and shared here. */ -}}
{{- $roles := include "yarilo.internalTLSRoles" . | fromYamlArray }}
{{- $full := include "yarilo.fullname" . }}
{{- $serverName := .Values.internalTLS.serverName | default (printf "%s-internal" $full) }}
{{- $itls := .Values.internalTLS }}
{{- $cm := $itls.certManager | default dict }}
{{- if and $roles $cm.enabled }}
{{- range $role := $roles }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-%s-internal-tls" $full $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "yarilo.labels" $ | nindent 4 }}
spec:
  secretName: {{ printf "%s-%s-internal-tls" $full $role }}
  issuerRef:
    kind: {{ $cm.issuerRef.kind }}
    name: {{ required "internalTLS.certManager.issuerRef.name is required" $cm.issuerRef.name }}
  dnsNames:
    {{- include "yarilo.internalTLSNames" (dict "root" $ "role" $role "serverName" $serverName) | nindent 4 }}
{{- end }}
{{- else if $roles }}
{{- /* lookup sees the cluster only on a real install or upgrade; helm template
       and dry runs get empty answers and mint throwaway certificates. */}}
{{- $live := lookup "v1" "Namespace" "" .Release.Namespace }}
{{- $ca := dict }}
{{- $caSecret := ($itls.ca | default dict).secretName }}
{{- if $caSecret }}
{{- $s := lookup "v1" "Secret" .Release.Namespace $caSecret }}
{{- if $s }}
{{- $ca = buildCustomCert (index $s.data "tls.crt") (index $s.data "tls.key") }}
{{- else if $live }}
{{- fail (printf "internalTLS.ca.secretName %q: no such Secret in %s" $caSecret .Release.Namespace) }}
{{- else }}
{{- $ca = genCA "yarilo-internal-ca" 3650 }}
{{- end }}
{{- else }}
{{- $own := lookup "v1" "Secret" .Release.Namespace (printf "%s-internal-ca" $full) }}
{{- if $own }}
{{- $ca = buildCustomCert (index $own.data "tls.crt") (index $own.data "tls.key") }}
{{- else }}
{{- $ca = genCA "yarilo-internal-ca" 3650 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-internal-ca" $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
  annotations:
    # Losing the CA re-issues every certificate; keep it past an uninstall.
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- $caSum := sha256sum $ca.Cert }}
{{- $gen := toString ($itls.certGeneration | default 0) }}
{{- range $role := $roles }}
{{- $name := printf "%s-%s-internal-tls" $full $role }}
{{- $old := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $ann := (($old | default dict).metadata | default dict).annotations | default dict }}
{{- $data := dict }}
{{- if and $old (eq (index $ann "yarilo.io/ca-sha256" | default "") $caSum) (eq (index $ann "yarilo.io/cert-generation" | default "") $gen) }}
{{- $data = $old.data }}
{{- else }}
{{- $names := include "yarilo.internalTLSNames" (dict "root" $ "role" $role "serverName" $serverName) | fromYamlArray }}
{{- $c := genSignedCert $role nil $names 3650 $ca }}
{{- $data = dict "tls.crt" ($c.Cert | b64enc) "tls.key" ($c.Key | b64enc) "ca.crt" ($ca.Cert | b64enc) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "yarilo.labels" $ | nindent 4 }}
  annotations:
    yarilo.io/role: {{ $role | quote }}
    yarilo.io/ca-sha256: {{ $caSum | quote }}
    yarilo.io/cert-generation: {{ $gen | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $data "tls.crt" }}
  tls.key: {{ index $data "tls.key" }}
  ca.crt: {{ index $data "ca.crt" }}
{{- end }}
{{- end }}
