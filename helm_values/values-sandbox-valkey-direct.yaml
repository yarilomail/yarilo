## Overlay for the Valkey trial (seconddns/k8s_valkey): yarilo reaches the
## Valkey pod valkey-0 directly, without HAProxy, so a run on it against a run
## through HAProxy prices the extra hop. valkey-0 must be the master: no
## failover follows it here. Applied with ACCEPT_VALUES on top of
## values-sandbox.yaml; never a stand default.
dicts:
  acl_shared:
    settings:
      addr: valkey-0.valkey-headless.redis.svc.cluster.local:6379
  quota_clone_redis:
    settings:
      addr: valkey-0.valkey-headless.redis.svc.cluster.local:6379
  sieve_duplicate:
    settings:
      addr: valkey-0.valkey-headless.redis.svc.cluster.local:6379

redis:
  externalUrl: "redis://valkey-0.valkey-headless.redis.svc.cluster.local:6379/0"

components:
  auth:
    token:
      redis_addr: "redis://valkey-0.valkey-headless.redis.svc.cluster.local:6379/0"
