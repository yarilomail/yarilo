version: "2"
linters:
  enable:
    - bodyclose
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    ## v1's staticcheck and gosimple, without the stylecheck and quickfix sets v2 folds in.
    staticcheck:
      checks:
        - SA*
        - S1*
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
  exclusions:
    generated: lax
    ## No `comments` preset: revive's missing-comment reports stay.
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - unparam
        path: _test\.go
      ## pkg/ is the importable API: its exported identifiers carry godoc (#2316).
      - linters:
          - revive
        path-except: ^pkg/
      - linters:
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yarilomail/yarilo/v2
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
