# yarilo and yarilo-login join yarilo-auth, which owns the auth and warden sockets.
u yarilo       - "yarilo mail server"     /nonexistent /usr/sbin/nologin
u yarilo-auth  - "yarilo authentication"  /nonexistent /usr/sbin/nologin
u yarilo-login - "yarilo login proxies"   /nonexistent /usr/sbin/nologin
m yarilo       yarilo-auth
m yarilo-login yarilo-auth
