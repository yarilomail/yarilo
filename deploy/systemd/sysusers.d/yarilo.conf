# yarilo-auth owns the auth and warden sockets; yarilo-master is the master
# socket's group: the backends and the delivery proxy, never the login proxies.
u yarilo          - "yarilo mail server"       /nonexistent /usr/sbin/nologin
u yarilo-auth     - "yarilo authentication"    /nonexistent /usr/sbin/nologin
u yarilo-login    - "yarilo login proxies"     /nonexistent /usr/sbin/nologin
u yarilo-delivery - "yarilo delivery proxy"    /nonexistent /usr/sbin/nologin
g yarilo-master   -
m yarilo          yarilo-auth
m yarilo-login    yarilo-auth
m yarilo-delivery yarilo-auth
m yarilo          yarilo-master
m yarilo-delivery yarilo-master
m yarilo-auth     yarilo-master
